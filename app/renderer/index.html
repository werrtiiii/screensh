<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self' 'unsafe-inline' ws: wss: http: https:; media-src 'self' blob: mediastream:; img-src 'self' data: blob:; connect-src 'self' ws: wss: http: https:;" />
  <title>ScreenSh 屏幕共享</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <div class="custom-titlebar">
      <div class="titlebar-drag-region">
        <span class="titlebar-title" aria-hidden="true"></span>
      </div>
      <div class="titlebar-controls">
        <button id="btnMinWindow" class="control-btn minimize-btn" title="最小化" aria-label="最小化">−</button>
        <button id="btnMaxWindow" class="control-btn maximize-btn" title="最大化" aria-label="最大化">□</button>
        <button id="btnCloseWindow" class="control-btn close-btn" title="关闭" aria-label="关闭">×</button>
      </div>
    </div>

    <!-- ===== Lobby ===== -->
    <div id="lobby" class="screen active workspace-screen">
      <aside class="workspace-sidebar lobby-sidebar">
        <div class="sidebar-search"><span>⌕</span><input id="serverSearch" type="text" placeholder="搜索服务器" /></div>
        <div class="nav-section-title"><span>服务器</span><div class="section-actions"><button id="btnAddBookmark" class="icon-btn" title="添加服务器">＋</button><button id="btnCollapseBookmarks" class="icon-btn" title="收起书签">⌃</button></div></div>
        <form id="bookmarkAddForm" class="bookmark-add-form hidden"><span>＋</span><input id="bookmarkUrlInput" type="text" placeholder="书签地址" autocomplete="off" /><button type="submit" class="icon-btn" title="保存">↵</button></form>
        <div id="bookmarkList" class="bookmark-list"></div>
        <div class="sidebar-spacer"></div>
        <div class="profile-bar">
          <label class="profile-avatar profile-avatar-button" id="btnAvatar" for="avatarInput" title="设置头像" aria-label="设置头像" role="button" tabindex="0">👤</label><input id="avatarInput" class="avatar-file-input" type="file" accept="image/png,image/jpeg,image/webp,image/gif" />
          <input id="userName" class="profile-name" type="text" placeholder="设置名称" maxlength="20" autocomplete="off" /><button id="btnEditName" class="icon-btn" title="编辑名称">✎</button>
          <button id="btnSettings" class="icon-btn settings-trigger" title="系统设置" aria-label="系统设置"><svg class="settings-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.7 4.3 10.2 2h3.6l.5 2.3 1.7 1 2.2-.7 1.8 3.1-1.7 1.6v2l1.7 1.6-1.8 3.1-2.2-.7-1.7 1-.5 2.3h-3.6l-.5-2.3-1.7-1-2.2.7L4 13.9l1.7-1.6v-2L4 8.7l1.8-3.1 2.2.7z" transform="translate(0 1.5)"/><circle cx="12" cy="12" r="3"/></svg></button>
        </div>
      </aside>
      <main class="empty-workspace">
        <div class="lobby-connect-panel">
          <h1>选择一个服务器开始</h1>
          <p>从左侧书签选择服务器，或输入地址连接。</p>
          <div class="connect-inline">
            <input type="text" id="serverUrl" placeholder="https://你的服务器域名" />
            <button id="btnTestServer" class="btn btn-outline btn-sm">检测</button>
            <span id="serverStatus" class="status-dot disconnected"></span>
          </div>
          <button id="btnConnect" class="btn btn-primary">连接服务器</button>
        </div>
      </main>
      <aside class="right-blank-panel hidden"></aside>
      <div class="legacy-lobby-fields hidden">
        <p id="runtimeCleanupStatus" class="hidden" role="alert" style="color:var(--danger);overflow-wrap:anywhere"></p>
        <button id="btnRetryCleanup" class="btn btn-outline btn-sm hidden" type="button">重试清理</button>
      </div>
    </div>

    <!-- ===== Room ===== -->
    <div id="room" class="screen workspace-screen">
      <aside class="workspace-sidebar room-sidebar">
        <div class="server-current"><span id="roomServerIcon" class="server-icon" aria-hidden="true">S</span><div><strong id="roomServerName">0091 Server</strong><small id="roomServerAddress"></small></div><button id="btnLeave" class="icon-btn" title="断开连接">×</button></div>
        <div class="room-bookmarks">
          <div class="nav-section-title"><span>书签</span><div class="section-actions"><button id="btnRoomBookmark" class="icon-btn" title="保存当前服务器">☆</button><button id="btnCollapseRoomBookmarks" class="icon-btn" title="收起书签">⌃</button></div></div>
          <form id="roomBookmarkAddForm" class="bookmark-add-form hidden"><span>＋</span><input id="roomBookmarkUrlInput" type="text" placeholder="书签地址" autocomplete="off" /><button type="submit" class="icon-btn" title="保存">↵</button></form>
          <div id="roomBookmarkList" class="bookmark-list compact"></div>
        </div>
        <div class="nav-section-title channel-nav-title"><span>频道</span><button id="btnAddChannel" class="icon-btn hidden" title="创建频道">＋</button></div>
        <div id="channelList" class="channel-list"></div>
        <div class="sidebar-spacer"></div>
        <div class="profile-bar">
          <label class="profile-avatar profile-avatar-button" id="btnRoomAvatar" for="avatarInput" title="设置头像" aria-label="设置头像" role="button" tabindex="0">👤</label>
          <input id="roomUserName" class="profile-name" type="text" placeholder="设置名称" maxlength="20" autocomplete="off" /><button id="btnEditRoomName" class="icon-btn" title="编辑名称">✎</button>
          <button id="btnRoomSettings" class="icon-btn settings-trigger" title="系统设置" aria-label="系统设置"><svg class="settings-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.7 4.3 10.2 2h3.6l.5 2.3 1.7 1 2.2-.7 1.8 3.1-1.7 1.6v2l1.7 1.6-1.8 3.1-2.2-.7-1.7 1-.5 2.3h-3.6l-.5-2.3-1.7-1-2.2.7L4 13.9l1.7-1.6v-2L4 8.7l1.8-3.1 2.2.7z" transform="translate(0 1.5)"/><circle cx="12" cy="12" r="3"/></svg></button>
        </div>
      </aside>
      <div class="room-topbar">
        <div class="room-info" style="display: flex; align-items: center; gap: 8px;">
          <span id="currentChannelIcon" aria-hidden="true"></span><span id="channelNameDisplay"></span>
        </div>
        <div class="room-actions">
          <button id="btnServerSettings" class="btn btn-outline btn-sm hidden">服务器设置</button>
          <button id="btnRoomSettingsToolbar" class="btn btn-outline btn-sm">屏幕共享设置</button>
          <button id="btnShare" class="btn btn-primary btn-sm">共享屏幕</button>
          <button id="btnStopShare" class="btn btn-danger btn-sm hidden">停止共享</button>
        </div>
      </div>

      <div class="room-main">
        <button id="btnMemberNetwork" class="member-network-button" type="button" title="成员 IP 和网络延迟" aria-label="成员 IP 和网络延迟">?</button>
        <div id="mainContent" class="main-content">
          <!-- 大厅卡片网格 -->
          <div id="userCardsView" class="cards-grid"></div>

          <!-- 沉浸式观看视图 -->
          <div id="activeVideoView" class="active-video-view hidden">
            <div class="video-header">
              <button id="btnStopWatch" class="btn btn-outline btn-sm">← 返回</button>
              <span id="viewerNames" class="viewer-names" aria-live="polite">观众（0）：暂无观众</span>
            </div>
            <div id="videoContainer" class="video-container"></div>
          </div>
        </div>

        <!-- Sidebar: users + screen sources -->
        <div class="sidebar">
          <div class="side-panel">
            <div class="channel-heading"><h3>频道</h3></div>
          </div>
          <!-- Users list -->
          <div class="side-panel">
            <h3>服务器成员</h3>
            <ul id="userList" class="user-list"></ul>
          </div>
        </div>
      </div>
    </div>
    <div id="memberNetworkDialog" class="modal hidden">
      <div class="modal-content member-network-panel" role="dialog" aria-modal="true" aria-label="成员 IP 和网络延迟">
        <div class="modal-header" style="justify-content:flex-end"><button id="btnCloseMemberNetwork" type="button" class="btn-close" aria-label="关闭">×</button></div>
        <table class="member-network-table"><thead><tr><th>成员</th><th>虚拟 IP</th><th>延迟（Ping）</th></tr></thead><tbody id="memberNetworkRows"></tbody></table>
        <details id="voiceDiagnostics" class="voice-diagnostics"><summary>语音连接统计</summary><div class="voice-diagnostics-body"></div></details>
      </div>
    </div>
    <div id="channelDialog" class="modal hidden">
      <form id="createChannelForm" class="modal-content" role="dialog" aria-modal="true" aria-labelledby="channelDialogTitle">
        <div class="modal-header"><h2 id="channelDialogTitle">创建频道</h2><button id="btnCancelChannel" type="button" class="btn-close" aria-label="关闭">×</button></div>
        <div class="form-group"><label for="channelNameInput">频道名称</label><input type="text" id="channelNameInput" placeholder="新频道名称" maxlength="30" required /></div>
        <div class="channel-icon-setting"><span id="channelIconPreview" class="channel-icon-preview" aria-label="频道图标"></span><div><button id="btnChooseChannelIcon" type="button" class="btn btn-outline btn-sm">选择图标</button><button id="btnResetChannelIcon" type="button" class="btn btn-outline btn-sm">恢复默认</button><small>PNG/JPEG/WebP/GIF，最大2MB</small></div><input id="channelIconInput" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden /></div>
        <div class="dialog-actions"><button id="btnCreateChannel" class="btn btn-primary" type="submit">创建频道</button></div>
      </form>
    </div>
    <div id="screenPicker" class="modal hidden">
      <div class="modal-content source-dialog" role="dialog" aria-modal="true" aria-labelledby="sourceDialogTitle">
        <div class="modal-header"><h2 id="sourceDialogTitle">选择共享源</h2><button id="btnCancelPicker" class="btn-close" aria-label="关闭">×</button></div>
        <div id="screenList" class="screen-list"></div>
        <button id="btnConfirmShare" class="btn btn-primary btn-full hidden">确认共享</button>
      </div>
    </div>
    <div id="serverSettingsDialog" class="modal hidden">
      <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="serverSettingsTitle">
        <div class="modal-header"><h2 id="serverSettingsTitle">服务器设置</h2><button id="btnCloseServerSettings" class="btn-close" aria-label="关闭">×</button></div>
        <form id="serverNameForm" class="server-name-form">
          <label for="serverNameInput">服务器名称</label>
          <div class="server-name-controls"><input id="serverNameInput" class="form-control" type="text" maxlength="40" required placeholder="0091 Server" /><button id="btnSaveServerName" type="submit" class="btn btn-primary btn-sm">保存</button></div>
          <p id="serverNameError" class="dialog-error" role="alert"></p>
        </form>
        <div class="server-setting-row"><span>EasyTier 组网节点</span><button id="btnServerPeers" class="btn btn-outline btn-sm">配置节点</button></div>
        <div class="server-setting-row"><span>服务器图标 <small>PNG/JPEG/WebP/GIF，最大2MB</small></span><div class="image-setting-actions"><button id="btnServerIcon" class="btn btn-outline btn-sm">选择图片</button><button id="btnResetServerIcon" class="btn btn-outline btn-sm" disabled>恢复默认</button></div><input id="serverIconInput" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden /></div>
        <div class="server-setting-row"><span>连接密码</span><button id="btnServerPassword" class="btn btn-outline btn-sm">服务器密码</button></div>
      </div>
    </div>
    <div id="serverPeersDialog" class="modal hidden">
      <form id="serverPeersForm" class="modal-content" role="dialog" aria-modal="true" aria-labelledby="serverPeersTitle">
        <div class="modal-header"><h2 id="serverPeersTitle">服务器组网节点</h2><button id="btnCancelServerPeers" type="button" class="btn-close" aria-label="关闭">×</button></div>
        <div class="form-group"><label for="serverPeersInput">EasyTier 节点 <span class="help-tip" data-tooltip="帮助成员建立虚拟局域网传输共享画面。每行一个，支持 TCP / UDP，未写协议时使用 TCP。保存到服务器，下次连接生效。">?</span></label>
          <textarea id="serverPeersInput" class="form-control" rows="5" spellcheck="false" placeholder="主机:端口"></textarea>
        </div>
        <p id="serverPeersError" class="dialog-error" role="alert"></p>
        <div class="dialog-actions"><button id="btnSaveServerPeers" type="submit" class="btn btn-primary">保存节点</button></div>
      </form>
    </div>
    <div id="bookmarkEditDialog" class="modal hidden">
      <form id="bookmarkEditForm" class="modal-content" role="dialog" aria-modal="true" aria-labelledby="bookmarkEditTitle">
        <div class="modal-header"><h2 id="bookmarkEditTitle">编辑书签</h2><button id="btnCancelBookmarkEdit" type="button" class="btn-close" aria-label="关闭">×</button></div>
        <div class="form-group"><label for="bookmarkEditName">名称</label><input id="bookmarkEditName" class="form-control" type="text" maxlength="40" required /></div>
        <div class="form-group"><label for="bookmarkEditUrl">服务器地址</label><input id="bookmarkEditUrl" class="form-control" type="text" required /></div>
        <p id="bookmarkEditError" class="dialog-error" role="alert"></p>
        <div class="dialog-actions"><button id="btnSaveBookmarkEdit" class="btn btn-primary" type="submit">保存</button></div>
      </form>
    </div>
    <!-- ===== Settings Modal ===== -->
    <div id="settingsModal" class="modal hidden">
      <div class="modal-content">
        <div class="modal-header">
          <h2>系统设置</h2>
          <button id="btnCloseSettings" class="btn-close">×</button>
        </div>
        <div class="modal-body">
          <div class="form-group setting-theme">
            <label for="themeSelect">主题外观
              <span class="help-tip" data-tooltip="切换深色或浅色外观。">?</span>
            </label>
            <select id="themeSelect" class="form-control">
              <option value="dark">深色</option>
              <option value="light" selected>浅色</option>
            </select>
          </div>
          <div class="form-group setting-update">
            <label>软件更新</label>
            <div class="update-row">
              <span id="updateStatus" class="update-status" role="status">当前版本</span>
              <button id="btnCheckUpdate" type="button" class="btn btn-outline btn-sm">检查更新</button>
            </div>
            <div id="updateActions" class="update-actions hidden">
              <button id="btnDownloadUpdate" type="button" class="btn btn-primary btn-sm">下载更新</button>
            </div>
          </div>
          <div class="form-group setting-hardware">
            <label style="display:flex;align-items:center;gap:8px;cursor:pointer;padding:4px 0;">
              <input type="checkbox" role="switch" id="hardwareAccelerationCheckbox" style="width:16px;height:16px;cursor:pointer;" />
              <span>启用硬件加速</span>
              <span class="help-tip" data-tooltip="使用显卡渲染软件界面。修改后需要重启客户端；关闭后使用软件渲染。">?</span>
            </label>
          </div>
          <div class="form-group setting-voice">
            <label for="voiceMicrophone">麦克风</label>
            <select id="voiceMicrophone" class="form-control"><option value="default">系统默认麦克风</option></select>
            <label for="voiceSpeaker">扬声器</label>
            <select id="voiceSpeaker" class="form-control"><option value="default">系统默认扬声器</option></select>
            <div class="voice-device-actions"><button id="btnVoiceDevices" class="btn btn-outline btn-sm" type="button">刷新</button><button id="btnMicrophoneTest" class="btn btn-outline btn-sm" type="button">测试</button></div>
            <meter id="microphoneLevel" min="0" max="1" value="0" aria-label="麦克风电平"></meter>
            <small id="voiceTestStatus" class="hidden" role="status"></small>
          </div>
          <div class="form-group setting-room">
            <label for="videoEncoderSelect">视频编码器
              <span class="help-tip" data-tooltip="Intel 核显选 QSV，AMD 核显或独显选 AMF，NVIDIA 选 NVENC。需对应显卡及驱动支持；失败时可选软件编码。">?</span>
            </label>
            <select id="videoEncoderSelect" class="form-control">
              <option value="x264">软件编码 · H.264 (CPU / x264)</option>
              <option value="nvenc">硬件编码 · H.264 (NVIDIA NVENC)</option>
              <option value="qsv">硬件编码 · H.264 (Intel 核显 / QSV)</option>
              <option value="amf">硬件编码 · H.264 (AMD 核显 / 独显 AMF)</option>
            </select>
          </div>
          <div class="form-group setting-room">
            <label><input type="checkbox" role="switch" id="autoPreviewCheckbox" checked> 自动预览
              <span class="help-tip" data-tooltip="共享后自动预览自己的画面。">?</span>
            </label>
          </div>
          <div class="form-group setting-room">
            <label><input type="checkbox" role="switch" id="adaptiveResolutionCheckbox"> 自动调整分辨率
              <span class="help-tip" data-tooltip="根据观众网络自动降低或恢复分辨率，但会影响所有观众。下次开始共享生效。">?</span>
            </label>
          </div>
          <div class="form-group setting-room">
            <label for="resolutionSelect">共享分辨率
              <span class="help-tip" data-tooltip="越高越清晰，占用也越高。">?</span>
            </label>
            <select id="resolutionSelect" class="form-control">
              <option value="auto">原始分辨率（自动）</option>
              <option value="1920x1080">1080p (1920x1080)</option>
              <option value="1280x720" selected>720p (1280x720)</option>
              <option value="854x480">480p (854x480)</option>
            </select>
          </div>
          <div class="form-group setting-room">
            <label for="captureMethodSelect">整屏采集方式
              <span class="help-tip" data-tooltip="仅用于显示器共享。黑屏可尝试 WGC">?</span>
            </label>
            <select id="captureMethodSelect" class="form-control">
              <option value="auto">自动</option>
              <option value="wgc">WGC（Windows 图形采集）</option>
              <option value="dxgi">DXGI（桌面复制）</option>
            </select>
          </div>
          <div class="form-group setting-room">
            <label for="frameRateSelect">帧率 (FPS)
              <span class="help-tip" data-tooltip="目标每秒帧数。">?</span>
            </label>
            <select id="frameRateSelect" class="form-control">
              <option value="30">30 FPS</option>
              <option value="60">60 FPS</option>
              <option value="15">15 FPS</option>
            </select>
          </div>
          <div class="form-group setting-room">
            <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; padding: 4px 0;">
              <input type="checkbox" role="switch" id="shareAudioCheckbox" style="width: 16px; height: 16px; cursor: pointer;" />
              <span>同时共享音频</span>
              <span class="help-tip" data-tooltip="窗口共享程序声音，全屏共享系统声音。">?</span>
            </label>
          </div>
          <div class="form-group setting-room">
            <label for="bitrateInput" style="display: flex; justify-content: space-between; align-items: center;">
              <span>视频码率 (kbps)
                <span class="help-tip" data-tooltip="目标视频码率。推荐值在共享开始时按分辨率和帧率计算">?</span>
              </span>
              <label style="font-size: 12px; font-weight: normal; cursor: pointer; display: flex; align-items: center; gap: 4px;">
                <input type="checkbox" role="switch" id="autoBitrateCheckbox"> 推荐
              </label>
            </label>
            <input type="number" id="bitrateInput" class="form-control" min="100" max="10000" step="100" value="1000">
          </div>
          <div class="form-group setting-room">
            <label for="audioBitrateSelect">音频码率
              <span class="help-tip" data-tooltip="越高音质越好">?</span>
            </label>
            <select id="audioBitrateSelect" class="form-control">
              <option value="32">32 kbps</option>
              <option value="64">64 kbps</option>
              <option value="128" selected>128 kbps</option>
              <option value="256">256 kbps</option>
            </select>
          </div>

        </div>
      </div>
    </div>
  </div>

  <script src="../node_modules/socket.io-client/dist/socket.io.min.js"></script>
  <script type="module" src="renderer.js"></script>
</body>
</html>
