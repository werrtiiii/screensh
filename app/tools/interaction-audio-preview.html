<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>互动音效对应表</title><style>
 body{font:16px system-ui;background:#f3f4fa;color:#242438;max-width:1040px;margin:32px auto;padding:0 20px}h1{font-size:26px}p{color:#626277;line-height:1.7}.sounds{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}.sound,section{background:white;padding:20px;border-radius:16px;box-shadow:0 3px 16px #24243809}audio{width:100%;margin:12px 0}select,button{font:inherit;border:1px solid #ddddea;border-radius:8px;padding:9px;background:white}select{width:100%}button{cursor:pointer;color:#fff;background:#5b5cf6;border:0}.effects{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:12px;margin:24px 0}.effect{background:white;padding:10px;border-radius:12px;text-align:center}.effect img{display:block;width:80px;height:80px;object-fit:contain;margin:auto}.effect button{font-size:13px;padding:6px 9px;margin-top:8px}textarea{box-sizing:border-box;width:100%;min-height:220px;font:15px system-ui;padding:12px;border:1px solid #ddddea;border-radius:10px;margin:12px 0}small{color:#777}section{margin:24px 0}
 </style><h1>互动音效对应表</h1><p>先逐个播放音效，再选择它应该对应的互动。下面可以预览每种动画。选好后复制结果发给我；编号固定对应原始音频文件，不会随选择变化。本页面只在本地运行。</p><div class="effects" id="effects"></div><div class="sounds" id="sounds"></div><section><strong>把下面的对应表发给我</strong><textarea id="result" readonly></textarea><button id="copy">复制对应表</button> <small id="status"></small></section><script>
 const items=[{"number":1,"name":"便便","icon":"../renderer/assets/interactions/84e1b54d2fbf204d652f7e18dc1edf32.webp","animation":"../renderer/assets/interactions/6ba07295c9c17a41dd9763083296b930.webp","sound":"../renderer/assets/interactions/2795a4f36b9746ca555d68bcdeb74f3d.wav"},{"number":2,"name":"番茄","icon":"../renderer/assets/interactions/4420b3e9fa3b3552bf95ddb9aea935ad.webp","animation":"../renderer/assets/interactions/14226d97c8e3638a25928a57c0a6a57c.webp","sound":"../renderer/assets/interactions/578a24e218b6ca448d1225822ceb103e.wav"},{"number":3,"name":"鸡蛋","icon":"../renderer/assets/interactions/fbd9aaaa32dc2416191c8323b36f6874.webp","animation":"../renderer/assets/interactions/31aa7967f05714569751ffebe448b0a6.webp","sound":"../renderer/assets/interactions/6020686512b7a69a2dfeb4b4fea84c99.wav"},{"number":4,"name":"爱心","icon":"../renderer/assets/interactions/85677ab0c2aa851c5c27706b889aa224.webp","animation":"../renderer/assets/interactions/263843755a4d155ee2a7b0837dcd949c.webp","sound":"../renderer/assets/interactions/8b67b00efb9dc1662602f9dcca2d137b.wav"},{"number":5,"name":"炸弹","icon":"../renderer/assets/interactions/0b57ff44f9e7492e24169cb645fda996.webp","animation":"../renderer/assets/interactions/4b03d5d2bd04b51660ed5db4e78b37c2.webp","sound":"../renderer/assets/interactions/8cd8e86da2c11d2708a14f963ed9a2d4.wav"},{"number":6,"name":"蛋糕","icon":"../renderer/assets/interactions/e318ad7662fefcede2a85fac997e9efb.webp","animation":"../renderer/assets/interactions/6c49b3afd7758f476ac1dd3ca7e9a032.webp","sound":"../renderer/assets/interactions/b5c5b62773141a7b61473fdec09b514b.wav"},{"number":7,"name":"踩一下","icon":"../renderer/assets/interactions/89cef5c54105b62bce051d97d81e9806.webp","animation":"../renderer/assets/interactions/db728455d2e074b99fa9419161929ecb.webp","sound":"../renderer/assets/interactions/d5360abfc672e4fc78aa3ad3b4ae3036.wav"},{"number":8,"name":"拳击","icon":"../renderer/assets/interactions/72cadf32f10b620aa6d651f2ea5b408f.webp","animation":"../renderer/assets/interactions/ddc1638774aa5e7834d26086d8282759.webp","sound":"../renderer/assets/interactions/e68d131f1c5a51e7b0f799199c186dbd.wav"},{"number":9,"name":"问号","icon":"../renderer/assets/interactions/843eccf2d03c8330cf79813a11b981b1.webp","animation":"../renderer/assets/interactions/5a077b5714ecd2eb0f8c67a3c3401fa2.webp","sound":"../renderer/assets/interactions/f4bcca813a515d955c896a01d470d3a4.wav"}];
 const result=document.querySelector('#result');
 function update(){result.value=[...document.querySelectorAll('select')].map((s,i)=>'音效 '+(i+1)+' → '+(s.value||'待确认')).join('\n')}
 items.forEach(item=>{
 const effect=document.createElement('div');effect.className='effect';const img=document.createElement('img');img.src=item.icon;img.alt=item.name;
 const name=document.createElement('div');name.textContent=item.name;const preview=document.createElement('button');preview.textContent='预览动画';preview.onclick=()=>{img.src=item.animation+'?play='+Date.now();setTimeout(()=>img.src=item.icon,7500)};effect.append(img,name,preview);document.querySelector('#effects').append(effect);
 const card=document.createElement('div');card.className='sound';const title=document.createElement('strong');title.textContent='音效 '+item.number;
 const audio=document.createElement('audio');audio.controls=true;audio.preload='metadata';audio.src=item.sound;audio.onplay=()=>document.querySelectorAll('audio').forEach(a=>{if(a!==audio)a.pause()});
 const select=document.createElement('select');select.setAttribute('aria-label','音效 '+item.number+' 对应的互动');select.add(new Option('请选择对应互动',''));items.forEach(x=>select.add(new Option(x.name,x.name)));select.onchange=update;
 card.append(title,audio,select);document.querySelector('#sounds').append(card);
 });update();document.querySelector('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(result.value);document.querySelector('#status').textContent='已复制，粘贴到聊天即可'}catch{result.focus();result.select();document.querySelector('#status').textContent='按 Ctrl+C 复制，再粘贴到聊天'}};
 </script></html>
