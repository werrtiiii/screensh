<!doctype html>
<meta charset="UTF-8">
<video autoplay muted playsinline></video>
<script type="module">
import { WhepSession } from '../../renderer/whep.mjs';
import { sampleVideoStats } from '../../renderer/video-stats.mjs';
window.verifyStream = async (requireAudio = null, checkCorners = false) => {
  const video = document.querySelector('video');
  video.muted = requireAudio === null;
  video.volume = requireAudio === null ? 0 : 0.05;
  const media = new MediaStream();
  let failure, lastRgb;
  let baseline;
  const port = new URLSearchParams(location.search).get('port') || '8889';
  const session = new WhepSession(`http://127.0.0.1:${port}/live/whep`, { iceServers: [] }, event => {
    media.addTrack(event.track); video.srcObject = media; video.play().catch(() => {});
  }, error => { failure = error; });
  try {
    await session.start();
    for (let i = 0; i < 100; i++) {
      if (failure) throw failure;
      const stats = await session.pc.getStats();
      const measured = sampleVideoStats(stats, baseline);
      if (!baseline && measured.snapshot?.framesDecoded > 0) baseline = measured.snapshot;
      const audio = [...stats.values()].find(s => s.type === 'inbound-rtp' && s.kind === 'audio');
      const inbound = [...stats.values()].find(s => s.type === 'inbound-rtp' && s.kind === 'video' && s.framesDecoded > 0);
      if (inbound && video.readyState >= 2) {
        const canvas = document.createElement('canvas'); canvas.width = canvas.height = 8;
        const context = canvas.getContext('2d'); context.drawImage(video, 0, 0, 8, 8);
        const rgb = [...context.getImageData(4, 4, 1, 1).data].slice(0, 3);
        lastRgb = rgb;
        let cornersVisible = true;
        if (checkCorners) {
          canvas.width = canvas.height = 160; context.drawImage(video, 0, 0, 160, 160);
          const pixels = context.getImageData(0, 0, 160, 160).data, found = [false, false, false, false];
          window.lastTestFrame = canvas.toDataURL();
          for (let p = 0; p < pixels.length; p += 4) {
            const [r,g,b] = pixels.slice(p,p+3);
            if(r>180&&g<80&&b<80)found[0]=true;
            if(g>180&&r<80&&b<80)found[1]=true;
            if(r>180&&g>180&&b<80)found[2]=true;
            if(r>180&&b>180&&g<80)found[3]=true;
          }
          cornersVisible = found.every(Boolean);
          window.lastCornersFound = found;
        }
        const audioReady = requireAudio === null || (requireAudio ? audio?.totalAudioEnergy > 0.000001 : audio?.totalSamplesDuration > 1 && audio.totalAudioEnergy < 0.00000001);
        if (Math.max(...rgb) > 100 && cornersVisible && audioReady && baseline && inbound.timestamp - baseline.timestamp >= 1500) return { framesDecoded: inbound.framesDecoded, width: inbound.frameWidth, height: inbound.frameHeight, rgb, audioEnergy: audio?.totalAudioEnergy, stats: Object.fromEntries(measured.rows) };
      }
      await new Promise(resolve => setTimeout(resolve, 100));
    }
    const stats = [...(await session.pc.getStats()).values()].filter(s => ['transport', 'inbound-rtp', 'codec'].includes(s.type));
    throw new Error('Expected video/audio not received: requireAudio=' + requireAudio + ' readyState=' + video.readyState + ' RGB=' + lastRgb + ' ' + session.pc.connectionState + '\n' + JSON.stringify(stats));
  } finally { session.close(); video.srcObject = null; media.getTracks().forEach(t => t.stop()); }
};
</script>
