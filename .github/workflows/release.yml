name: Release Windows installer

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build (for example v1.4.4 or 1.5.0)'
        required: true
        type: string
  push:
    tags:
      - 'v*.*.*'
      - '[0-9]*.*.*'

permissions:
  contents: write

concurrency:
  group: openlist-update-sync
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_OWNER: ${{ github.repository_owner }}
      GH_REPO: ${{ github.event.repository.name }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: true
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Check release version
        shell: pwsh
        run: |
          node -e "const p=require('./app/package.json'),l=require('./app/package-lock.json'),tag=process.env.RELEASE_TAG,v=tag.replace(/^v/,'');if(!/^v?\d+\.\d+\.\d+$/.test(tag)||p.version!==v||l.version!==v||l.packages[''].version!==v)throw Error('Release tag does not match package versions. Update and commit versions before tagging.');"

      - name: Check native runtime files
        shell: pwsh
        run: |
          $required = @('obs-studio-node/package.json', 'obs-studio-node/obs_studio_client.node', 'app/res/easytier-core.exe', 'app/res/easytier-cli.exe', 'app/res/mediamtx.exe', 'app/res/wintun.dll', 'app/res/Packet.dll')
          $missing = $required | Where-Object { -not (Test-Path -LiteralPath $_) }
          if ($missing) { throw "Missing native runtime files: $($missing -join ', '). Restore the native runtime bundle before packaging." }

      - name: Install dependencies
        run: npm ci --prefix app

      - name: Prepare process audio compiler
        shell: pwsh
        run: |
          $compilers = @('C:/mingw64/bin/g++.exe', 'C:/msys64/mingw64/bin/g++.exe', 'C:/msys64/ucrt64/bin/g++.exe', 'C:/ProgramData/chocolatey/lib/mingw/tools/install/mingw64/bin/g++.exe')
          if (-not (Get-Command g++ -ErrorAction SilentlyContinue) -and -not ($compilers | Where-Object { Test-Path -LiteralPath $_ })) {
            choco install mingw --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Cannot install the process audio compiler.' }
          }

      - name: Build NSIS installer
        run: npm run pack:win --prefix app

      - name: Verify update files
        shell: pwsh
        run: |
          $required = @('app/dist/latest.yml', "app/dist/ScreenSh-$($env:RELEASE_TAG.TrimStart('v'))-Setup.exe")
          $missing = $required | Where-Object { -not (Test-Path -LiteralPath $_) }
          if ($missing) { throw "Missing release files: $($missing -join ', ')" }

      - name: Verify installed runtime
        run: node app/scripts/check-installer.cjs

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            app/dist/latest.yml
            app/dist/ScreenSh-*-Setup.exe
            app/dist/ScreenSh-*-Setup.exe.blockmap
          fail_on_unmatched_files: true
          body_path: ${{ format('release-notes/{0}.md', env.RELEASE_TAG) }}

      - name: Read current download source configuration
        shell: pwsh
        run: |
          # Read main rather than the tag, so a changed mirror also applies to reruns.
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github.raw+json' }
          Invoke-WebRequest -Uri "https://api.github.com/repos/${{ github.repository }}/contents/update-sources.json?ref=main" -Headers $headers -OutFile app/dist/update-sources.json

      - name: Sync release to OpenList
        env:
          OPENLIST_USERNAME: ${{ secrets.OPENLIST_USERNAME }}
          OPENLIST_PASSWORD: ${{ secrets.OPENLIST_PASSWORD }}
        run: node app/scripts/sync-openlist.cjs app/dist/update-sources.json app/dist
