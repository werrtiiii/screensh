name: Release Windows installer

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_OWNER: ${{ github.repository_owner }}
      GH_REPO: ${{ github.event.repository.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Check native runtime files
        shell: pwsh
        run: |
          $required = @('obs-studio-node/package.json', 'obs-studio-node/obs_studio_client.node', 'app/res/easytier-core.exe', 'app/res/mediamtx.exe', 'app/res/wintun.dll', 'app/res/Packet.dll')
          $missing = $required | Where-Object { -not (Test-Path -LiteralPath $_) }
          if ($missing) { throw "Missing native runtime files: $($missing -join ', '). Restore the native runtime bundle before packaging." }

      - name: Install dependencies
        run: npm ci --prefix app

      - name: Build NSIS installer
        run: npm run pack:win --prefix app

      - name: Verify update files
        shell: pwsh
        run: |
          $required = @('app/dist/latest.yml', "app/dist/ScreenSh-$($env:GITHUB_REF_NAME.TrimStart('v'))-Setup.exe")
          $missing = $required | Where-Object { -not (Test-Path -LiteralPath $_) }
          if ($missing) { throw "Missing release files: $($missing -join ', ')" }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/dist/latest.yml
            app/dist/ScreenSh-*-Setup.exe
            app/dist/ScreenSh-*-Setup.exe.blockmap
          fail_on_unmatched_files: true
          generate_release_notes: true
