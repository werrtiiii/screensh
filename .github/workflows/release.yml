name: Release Windows installer

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build (for example v1.4.4 or 1.5.0)'
        required: true
        type: string
      skip_tests:
        description: 'Skip runtime smoke tests; keep release file checks'
        required: false
        default: false
        type: boolean
  push:
    tags:
      - 'v*.*.*'
      - '[0-9]*.*.*'
      - 'hotfix-*.*.*-b*'

permissions:
  contents: write

concurrency:
  group: release-${{ startsWith(inputs.tag || github.ref_name, 'hotfix-') && 'hotfix-index' || (inputs.tag || github.ref_name) }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_OWNER: ${{ github.repository_owner }}
      GH_REPO: ${{ github.event.repository.name }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: true
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Check release version
        id: version
        shell: pwsh
        run: |
          node -e "const p=require('./app/package.json'),l=require('./app/package-lock.json'),tag=process.env.RELEASE_TAG,build=p.screenshBuild??1,key=require('./app/main/update-identity.cjs').updateKey({version:p.version,build}),expected=build>1?'hotfix-'+key:p.version;if((tag!==expected&&(build>1||tag!=='v'+expected))||l.version!==p.version||l.packages[''].version!==p.version)throw Error('Release tag does not match the packaged version and build.');"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "hotfix=$($env:RELEASE_TAG.StartsWith('hotfix-').ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          $skipTests = ('${{ inputs.skip_tests }}' -eq 'true') -or ((git log -1 --format=%B) -match '\[skip runtime tests\]')
          "skip_tests=$($skipTests.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Check native runtime files
        shell: pwsh
        run: |
          $required = @('obs-studio-node/package.json', 'obs-studio-node/obs_studio_client.node', 'app/res/easytier-core.exe', 'app/res/easytier-core-no-tun.exe', 'app/res/easytier-cli.exe', 'app/res/mediamtx.exe', 'app/res/wintun.dll', 'app/res/Packet.dll')
          $missing = $required | Where-Object { -not (Test-Path -LiteralPath $_) }
          if ($missing) { throw "Missing native runtime files: $($missing -join ', '). Restore the native runtime bundle before packaging." }

      - name: Install dependencies
        run: npm ci --prefix app

      - name: Prepare process audio compiler
        shell: pwsh
        run: |
          $compilers = @('C:/mingw64/bin/g++.exe', 'C:/msys64/mingw64/bin/g++.exe', 'C:/msys64/ucrt64/bin/g++.exe', 'C:/ProgramData/chocolatey/lib/mingw/tools/install/mingw64/bin/g++.exe')
          if (-not (Get-Command g++ -ErrorAction SilentlyContinue) -and -not ($compilers | Where-Object { Test-Path -LiteralPath $_ })) {
            choco install mingw --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Cannot install the process audio compiler.' }
          }

      - name: Build NSIS installer
        run: npm run pack:win --prefix app

      - name: Verify release files and packaged runtime
        run: node app/scripts/check-installer.cjs ${{ steps.version.outputs.skip_tests == 'true' && '--files-only' || '' }}

      - name: Publish hotfix and promote index
        if: steps.version.outputs.hotfix == 'true'
        shell: pwsh
        run: ./app/scripts/publish-hotfix.ps1

      - name: Package server deployment files
        if: steps.version.outputs.hotfix == 'false'
        shell: pwsh
        run: ./app/scripts/package-server.ps1

      - name: Publish GitHub Release
        if: steps.version.outputs.hotfix == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            app/dist/latest.yml
            app/dist/ScreenSh-*-Setup.exe
            app/dist/ScreenSh-*-Setup.exe.blockmap
            app/dist/ScreenSh-*-Update.zip
            app/dist/ScreenSh-*-Update.json
            app/dist/ScreenSh-*-Blocks.bin
            app/dist/ScreenSh-*-server.zip
          fail_on_unmatched_files: true
          body_path: ${{ format('release-notes/{0}.md', env.RELEASE_TAG) }}
