name: Sync existing release to OpenList

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'Published stable release tag to sync (for example 1.5.3)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: openlist-update-sync
  cancel-in-progress: false

jobs:
  sync:
    # Keep the hosted fallback until the dedicated server runner is online.
    if: github.repository == 'werrtiiii/screensh' && ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || github.event_name == 'push')
    runs-on: ${{ fromJSON(vars.OPENLIST_RUNNER || '"windows-latest"') }}
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /update-sources.json
            /app/scripts/sync-openlist.cjs
            /app/scripts/openlist-runtime/
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/scripts/openlist-runtime/package-lock.json
      - name: Install script dependencies
        run: npm ci --prefix app/scripts/openlist-runtime --ignore-scripts --no-audit --no-fund
      - name: Download exact published release assets
        shell: bash
        run: |
          node -e 'if(!/^v?\d+\.\d+\.\d+$/.test(process.env.RELEASE_TAG))throw Error("Invalid stable release tag")'
          # A self-hosted runner retains its workspace between jobs.
          rm -f app/dist/latest.yml app/dist/ScreenSh-*-Setup.exe app/dist/ScreenSh-*-Setup.exe.blockmap
          mkdir -p app/dist
          version="${RELEASE_TAG#v}"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir app/dist --pattern latest.yml --pattern "ScreenSh-${version}-Setup.exe" --pattern "ScreenSh-${version}-Setup.exe.blockmap"
      - name: Sync release to OpenList
        env:
          NODE_PATH: ${{ github.workspace }}/app/scripts/openlist-runtime/node_modules
          NODE_USE_ENV_PROXY: '1'
          OPENLIST_USERNAME: ${{ secrets.OPENLIST_USERNAME }}
          OPENLIST_PASSWORD: ${{ secrets.OPENLIST_PASSWORD }}
          OPENLIST_PUBLISH_URL: ${{ vars.OPENLIST_PUBLISH_URL }}
        run: node app/scripts/sync-openlist.cjs update-sources.json app/dist
