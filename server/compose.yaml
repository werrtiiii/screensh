services:
  screensh-server:
    build: .
    restart: unless-stopped
    ports:
      - "31012:31012"
    environment:
      PORT: "31012"
      SCREENSH_STATE_FILE: /app/data/server-state.json
      # Required for a new server. Replace the empty value with a YAML block, one node per line.
      SCREENSH_EASYTIER_PEERS: ""
      # Only trust actual reverse proxies. For Docker, add the proxy's real IP/CIDR.
      SCREENSH_TRUST_PROXY: "loopback"
    volumes:
      - screensh-data:/app/data

volumes:
  screensh-data:
